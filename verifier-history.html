<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verifier History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.tab{
padding:10px;
margin-right:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h2>Verifier History</h2>

<button class="tab" onclick="loadVerified()">
Verified
</button>

<button class="tab" onclick="loadIssues()">
Payment Issues
</button>

<div id="list">
Loading...
</div>

<script>

const SUPABASE_URL =
"https://zozzoqzryejpkbddzoyi.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadVerified();

async function loadVerified(){

const { data } =
await db
.from("orders")
.select("*")
.eq("payment_status","verified")
.order("created_at",{ascending:false});

render(data);

}

async function loadIssues(){

const { data } =
await db
.from("orders")
.select("*")
.eq("payment_status","payment_issue")
.order("created_at",{ascending:false});

render(data);

}

function render(data){

document.getElementById("list").innerHTML =
data.map(order=>`

<div class="card">

<b>${order.order_code}</b>

<br><br>

Customer:
${order.customer_name}

<br>

Amount:
₹${order.grand_total}

<br>

Status:
${order.payment_status}

<br>

Verifier:
${order.verified_by || "-"}

<br>

Reason:
${order.rejection_reason || "-"}

</div>

`).join("");

}

</script>

</body>
</html>
