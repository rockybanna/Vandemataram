<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Order Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

img{
width:100%;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
background:#2196f3;
color:white;
}

</style>

</head>

<body>

<div id="order">
Loading...
</div>

<script>

const SUPABASE_URL =
"https://zozzoqzryejpkbddzoyi.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadOrder();

async function loadOrder(){

const orderId =
localStorage.getItem(
"selectedOrderId"
);

const { data:order } =
await db
.from("orders")
.select("*")
.eq("id",orderId)
.single();

const { data:items } =
await db
.from("order_items")
.select("*")
.eq("order_id",orderId);

document.getElementById(
"order"
).innerHTML =

`

<div class="card">

<h2>
${order.order_code}
</h2>

<div>
Customer:
${order.customer_name}
</div>

<div>
Phone:
${order.customer_phone}
</div>

<div>
Address:
${order.customer_address}
</div>

<br>

<div>
Distance:
${order.distance_km} km
</div>

<div>
Delivery:
₹${order.delivery_charge}
</div>

<div>
Platform Fee:
₹${order.platform_fee}
</div>

<div>
Grand Total:
₹${order.grand_total}
</div>

<br>

<div>
Status:
<b>${order.payment_status}</b>
</div>

<button
onclick="
localStorage.setItem(
'selectedOrderId',
'${order.id}'
);
window.location.href=
'customer-tracking.html';
">
Track Order
</button>

${
order.rejection_reason
?

`
<br>

<div style="color:red;">
Reason:
${order.rejection_reason}
</div>
`

:

""
}

</div>

<div class="card">

<h3>Items</h3>

${items.map(i=>`

<div>

${i.item_name}

x${i.quantity}

- ₹${i.price}

</div>

`).join("")}

</div>

<div class="card">

<h3>
Payment Screenshot
</h3>

<img
src="${order.payment_screenshot}"
>

</div>

${
order.payment_status ===
"payment_issue"

?

`

<input
type="file"
id="newScreenshot"
accept="image/*"
>

<button
onclick="resubmitScreenshot()">
Upload New Screenshot
</button>

`

:

""
}

`;

}

  async function resubmitScreenshot(){

const file =
document.getElementById(
"newScreenshot"
).files[0];

if(!file){
alert("Select screenshot");
return;
}

const fileName =
Date.now() + "_" + file.name;

const { error } =
await db.storage
.from("payments")
.upload(
fileName,
file
);

if(error){
alert(error.message);
return;
}

const { data:urlData } =
db.storage
.from("payments")
.getPublicUrl(
fileName
);

const orderId =
localStorage.getItem(
"selectedOrderId"
);

const { data:order } =
await db
.from("orders")
.select(
"resubmission_count"
)
.eq(
"id",
orderId
)
.single();

await db
.from("orders")
.update({

payment_screenshot:
urlData.publicUrl,

payment_status:
"waiting_verification",

order_status:
"waiting_verification",

rejection_reason:
null,

resubmission_count:
(order.resubmission_count || 0) + 1

})
.eq(
"id",
orderId
);

alert(
"Screenshot Submitted Again"
);

window.location.href =
"customer-history.html";

}
  
</script>

</body>
</html>
