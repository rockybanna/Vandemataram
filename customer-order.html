<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Order Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

img{
width:100%;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
background:#2196f3;
color:white;
}

</style>

</head>

<body>

<div id="order">
Loading...
</div>

<script>

const SUPABASE_URL =
"https://zozzoqzryejpkbddzoyi.supabase.co";

const SUPABASE_ANON_KEY =
"PASTE SAME KEY";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadOrder();

async function loadOrder(){

const orderId =
localStorage.getItem(
"selectedOrderId"
);

const { data:order } =
await db
.from("orders")
.select("*")
.eq("id",orderId)
.single();

const { data:items } =
await db
.from("order_items")
.select("*")
.eq("order_id",orderId);

document.getElementById(
"order"
).innerHTML =

`

<div class="card">

<h2>
${order.order_code}
</h2>

<div>
Customer:
${order.customer_name}
</div>

<div>
Phone:
${order.customer_phone}
</div>

<div>
Address:
${order.customer_address}
</div>

<br>

<div>
Distance:
${order.distance_km} km
</div>

<div>
Delivery:
₹${order.delivery_charge}
</div>

<div>
Platform Fee:
₹${order.platform_fee}
</div>

<div>
Grand Total:
₹${order.grand_total}
</div>

<br>

<div>
Status:
<b>${order.payment_status}</b>
</div>

${
order.rejection_reason
?

`
<br>

<div style="color:red;">
Reason:
${order.rejection_reason}
</div>
`

:

""
}

</div>

<div class="card">

<h3>Items</h3>

${items.map(i=>`

<div>

${i.item_name}

x${i.quantity}

- ₹${i.price}

</div>

`).join("")}

</div>

<div class="card">

<h3>
Payment Screenshot
</h3>

<img
src="${order.payment_screenshot}"
>

</div>

${
order.payment_status ===
"payment_issue"

?

`

<button
onclick="
alert(
'Resubmit Screenshot Coming Next'
)
">

Upload New Screenshot

</button>

`

:

""
}

`;

}

</script>

</body>
</html>
