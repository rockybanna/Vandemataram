<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FoodXpress Admin</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.header{
background:#e53935;
color:white;
padding:15px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.grid{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:12px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
font-weight:bold;
font-size:18px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card:hover{
transform:scale(1.02);
}

</style>
</head>

<body>

<div class="header">
FoodXpress Admin
</div>

<div class="grid">

<div class="card"
onclick="location.href='admin-restaurants.html'">
🏪
<br><br>
Restaurants
</div>

<div class="card"
onclick="location.href='admin-menu.html'">
🍔
<br><br>
Menu Builder
</div>

<div class="card"
onclick="location.href='admin-orders.html'">
📦
<br><br>
Orders
</div>

<div class="card"
onclick="location.href='admin-riders.html'">
🛵
<br><br>
Delivery Partners
</div>

<div class="card"
onclick="location.href='admin-settings.html'">
⚙️
<br><br>
Settings
</div>

<div class="card"
onclick="location.href='admin-reports.html'">
📊
<br><br>
Reports
</div>

</div>

</body>
</html>
