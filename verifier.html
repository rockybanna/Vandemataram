<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pending Verifications</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}

.header{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
cursor:pointer;
}

.code{
font-size:18px;
font-weight:bold;
color:#ff6600;
}

.amount{
font-weight:bold;
margin-top:8px;
}

</style>

</head>
<body>

<div class="header">
Pending Verifications
</div>

<div id="orders">
Loading...
</div>

<script>

const SUPABASE_URL =
https://zozzoqzryejpkbddzoyi.supabase.co
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadOrders();

async function loadOrders(){

const { data , error } =
await db
.from("orders")
.select("*")
.eq(
"payment_status",
"waiting_verification"
)
.order(
"created_at",
{ ascending:false }
);

if(error){
console.log(error);
return;
}

if(!data.length){

document.getElementById(
"orders"
).innerHTML =
"No Pending Orders";

return;

}

document.getElementById(
"orders"
).innerHTML =
data.map(order=>`

<div
class="card"
onclick="
localStorage.setItem(
'selectedOrderId',
'${order.id}'
);
window.location.href=
'verifier-order.html';
">

<div class="code">
${order.order_code}
</div>

<div>
Customer:
${order.customer_name}
</div>

<div>
Phone:
${order.customer_phone}
</div>

<div>
Grand Total:
₹${order.grand_total}
</div>

<div>
Status:
${order.payment_status}
</div>

</div>

`).join("");

}

</script>

</body>
</html>
