<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family:sans-serif; margin:0; background:#f5f5f5; }

.header {
  background:#000;
  color:#fff;
  padding:12px;
}

.title { color:#ff9800; font-weight:bold; }

.section {
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.input {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

.btn {
  background:#ff5722;
  color:#fff;
  border:none;
  width:100%;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="header">
<div class="title">
  Checkout
  <div style="font-size:12px;color:#8bc34a;margin-top:4px;">
    You saved ₹15 🎉
  </div>
</div>

<!-- CART SUMMARY -->

<div class="section" id="summary"></div>

<!-- CUSTOMER DETAILS -->

<div class="section">
  <div>Name</div>
  <input id="name" class="input" placeholder="Enter name">

  <div>Phone</div>
  <input id="phone" class="input" placeholder="Enter phone">

<div>Address</div>
<input id="address" class="input" placeholder="Enter address">

  <button
  type="button"
  id="locationBtn"
  onclick="getLocation()"
  class="btn"
  style="margin-top:10px;background:#2196f3;">
  📍 Use Current Location
</button>

<div
  id="locationStatus"
  style="margin-top:8px;font-size:13px;color:green;">
</div>
  
<div class="section">

  <div style="font-weight:bold;margin-bottom:10px;">
    Pay Using UPI
  </div>

  <img
    src="qr-codee.jpg.jpeg"
    style="
      width:220px;
      max-width:100%;
      display:block;
      margin:auto;
      border-radius:12px;
    ">

  <div style="
      text-align:center;
      margin-top:10px;
      font-weight:bold;
      color:#ff5722;
  ">
    UPI ID: rockybanna008ubi@ybl
  </div>

  <div style="
      text-align:center;
      margin-top:6px;
      font-size:13px;
      color:#666;
  ">
    Scan QR → Pay → Upload Screenshot
  </div>

</div>

<div style="margin-top:15px;">Payment Screenshot</div>
  
<input
  type="file"
  id="paymentScreenshot"
  class="input"
  accept="image/*">
  
</div>

<!-- BUTTON -->

<div class="section">
  <button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const db = createClient(

  "https://zozzoqzryejpkbddzoyi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE"
);

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;
  let deliveryCharge = 0;
let platformFee = 5;
let savings = 15;

let grandTotal = 0;

  let customerLat = null;
let customerLng = null;
  
  async function uploadPaymentScreenshot(file){

  const fileName =
    Date.now() + "_" + file.name;

  const { error } = await db.storage
    .from("payments")
    .upload(fileName, file);

  if(error){
    console.log(error);
    return null;
  }

  const { data } = db.storage
    .from("payments")
    .getPublicUrl(fileName);

  return data.publicUrl;
}
  

// CALCULATE TOTAL
cart.forEach(c => {
  total += (c.total || 0) * (c.qty || 1);
});
grandTotal = total + deliveryCharge + platformFee - savings;

if(grandTotal < 0){
  grandTotal = total;
}
  
// RENDER SUMMARY
document.getElementById("summary").innerHTML =
  cart.map(c => `
    <div style="margin-bottom:10px;">

      <div style="font-weight:600;">
        ${c.name} x${c.qty}
      </div>

      <div style="font-size:12px;color:#666;">
        ${c.variant && c.variant > 0 ? `• Variant ₹${c.variant}<br>` : ""}
        
        ${c.addons && c.addons.length > 0 
          ? c.addons.map(a => `• ${a.name} ₹${a.price}`).join("<br>") 
          : ""}
      </div>

      <div style="font-weight:bold;margin-top:4px;">
        ₹${(c.total || 0) * (c.qty || 1)}
      </div>

    </div>
`).join("") + `

<hr style="margin:10px 0; border:none; border-top:1px solid #eee;">

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Item Total</span>
  <span>₹${total}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Delivery Fee</span>
  <span>₹${deliveryCharge}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Platform Fee</span>
  <span>₹${platformFee}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;color:green;">
  <span>Savings</span>
  <span>-₹${savings}</span>
</div>

<hr style="margin:10px 0; border:none; border-top:1px solid #eee;">

<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:18px;">
  <span>Grand Total</span>
  <span>₹${grandTotal}</span>
</div>

`;

  async function getLocation(){

  if(!navigator.geolocation){
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(pos){

      customerLat = pos.coords.latitude;
      customerLng = pos.coords.longitude;

      document.getElementById(
        "locationStatus"
      ).innerHTML =
      "✅ Location Captured";

    },

    function(){

      document.getElementById(
        "locationStatus"
      ).innerHTML =
      "❌ Location Required";

    }

  );

}
  
// PLACE ORDER
async function placeOrder(){

  let name = document.getElementById("name").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let address = document.getElementById("address").value.trim();

  if(!customerLat || !customerLng){

  alert("Please allow location access");

  return;
}

  const screenshotFile =
  document.getElementById("paymentScreenshot")
  .files[0];

if(!screenshotFile){
  alert("Upload payment screenshot");
  return;
}

  // ✅ VALIDATION
  if(!name || !phone || !address){
    alert("Please fill all details");
    return;
  }

  if(phone.length < 10){
    alert("Enter valid phone number");
    return;
  }

  // ✅ CART CHECK
  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  // ✅ GPS CHECK
  if(!navigator.geolocation){
    alert("Location not supported");
    return;
  }

  // ✅ BUTTON LOCK
  const btn = document.querySelector(".btn");
  btn.disabled = true;
  btn.innerText = "Placing Order...";

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      try {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const mapLink =
          `https://www.google.com/maps?q=${lat},${lng}`;

const restaurantId = cart[0]?.resId || null;
        const { data: restaurantData } =
await db
.from("restaurants")
.select("lat,lng")
.eq("id", restaurantId)
.single();

const restaurantLat =
Number(restaurantData.lat);

const restaurantLng =
Number(restaurantData.lng);
        function haversineDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
  (lat2-lat1) * Math.PI/180;

  const dLon =
  (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2)
    +
    Math.cos(lat1*Math.PI/180)
    *
    Math.cos(lat2*Math.PI/180)
    *
    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);

  const c =
  2 * Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

  return R * c;
}
        let airDistance =
haversineDistance(
  customerLat,
  customerLng,
  restaurantLat,
  restaurantLng
);

let finalDistance = 0;

if(airDistance <= 5){
  finalDistance =
  airDistance * 1.5;
}else{
  finalDistance =
  airDistance * 1.3;
}

finalDistance =
Math.round(finalDistance * 2) / 2;
        deliveryCharge =
35 + (Math.max(finalDistance,1.5)-1.5)*10;
        deliveryCharge =
Math.round(deliveryCharge);
        grandTotal =
total +
deliveryCharge +
platformFee -
savings;

const screenshotUrl =
  await uploadPaymentScreenshot(
    screenshotFile
  );

if(!screenshotUrl){
  alert("Screenshot upload failed");
  return;
}
        
        // ✅ INSERT ORDER
        const { data: orderData, error: orderError } =
          await db
.from("orders")
          .insert([{
            restaurant_id: restaurantId,

            customer_name: name,
            customer_phone: phone,
            customer_address: address,
            customer_lat: customerLat,
            customer_lng: customerLng,
            map_link: mapLink,
            distance_km: finalDistance,

item_total: total,
delivery_charge: deliveryCharge,
platform_fee: platformFee,
grand_total: grandTotal,
            
payment_method: "UPI",

payment_status:
  "waiting_verification",

order_status:
  "waiting_verification",

payment_screenshot:
  screenshotUrl
          }])
          .select();

        if(orderError){
          console.log(orderError);
          alert("Order failed ❌");
          btn.disabled = false;
          btn.innerText = "Place Order";
          return;
        }

        const orderId = orderData[0].id;

        // ✅ ORDER ITEMS
        const itemsToInsert = cart.map(c => ({
          order_id: orderId,
          item_name: c.name,

          variant_name:
            (c.variant
              ? `Variant ₹${c.variant}`
              : "") +

            (c.addons && c.addons.length > 0
              ? " | " +
                c.addons.map(a => a.name).join(", ")
              : ""),

          quantity: c.qty,
          price: c.total
        }));

        const { error: itemError } =
          await db
          .from("order_items")
          .insert(itemsToInsert);

        if(itemError){
          console.log(itemError);
          alert("Items save failed ❌");
          btn.disabled = false;
          btn.innerText = "Place Order";
          return;
        }

        // ✅ SUCCESS
        localStorage.removeItem("cart");

        alert("Order Placed Successfully ✅");

        window.location.href = "index.html";

      } catch(err){

        console.log(err);

        alert("Something went wrong ❌");

        btn.disabled = false;
        btn.innerText = "Place Order";
      }

    },

    (err) => {

      alert("Please allow location access");

      btn.disabled = false;
      btn.innerText = "Place Order";
    }

  );
}

  getLocation();

</script>

</body>
</html>
