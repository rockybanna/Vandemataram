<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family:sans-serif; margin:0; background:#f5f5f5; }

.header {
  background:#000;
  color:#fff;
  padding:12px;
}

.title { color:#ff9800; font-weight:bold; }

.section {
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.input {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
}

.btn {
  background:#ff5722;
  color:#fff;
  border:none;
  width:100%;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="header">
<div class="title">
  Checkout
  <div style="font-size:12px;color:#8bc34a;margin-top:4px;">
    You saved ₹15 🎉
  </div>
</div>

<!-- CART SUMMARY -->

<div class="section" id="summary"></div>

<!-- CUSTOMER DETAILS -->

<div class="section">
  <div>Name</div>
  <input id="name" class="input" placeholder="Enter name">

  <div>Phone</div>
  <input id="phone" class="input" placeholder="Enter phone">

  <div>Address</div>
  <input id="address" class="input" placeholder="Enter address">
</div>

<!-- BUTTON -->

<div class="section">
  <button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
  "https://zozzoqzryejpkbddzoyi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE"
);

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;
  let deliveryCharge = 20;
let platformFee = 5;
let savings = 15;

let grandTotal = 0;

// CALCULATE TOTAL
cart.forEach(c => {
  total += (c.total || 0) * (c.qty || 1);
});
grandTotal = total + deliveryCharge + platformFee - savings;

if(grandTotal < 0){
  grandTotal = total;
}
  
// RENDER SUMMARY
document.getElementById("summary").innerHTML =
  cart.map(c => `
    <div style="margin-bottom:10px;">

      <div style="font-weight:600;">
        ${c.name} x${c.qty}
      </div>

      <div style="font-size:12px;color:#666;">
        ${c.variant && c.variant > 0 ? `• Variant ₹${c.variant}<br>` : ""}
        
        ${c.addons && c.addons.length > 0 
          ? c.addons.map(a => `• ${a.name} ₹${a.price}`).join("<br>") 
          : ""}
      </div>

      <div style="font-weight:bold;margin-top:4px;">
        ₹${(c.total || 0) * (c.qty || 1)}
      </div>

    </div>
`).join("") + `

<hr style="margin:10px 0; border:none; border-top:1px solid #eee;">

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Item Total</span>
  <span>₹${total}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Delivery Fee</span>
  <span>₹${deliveryCharge}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;">
  <span>Platform Fee</span>
  <span>₹${platformFee}</span>
</div>

<div style="display:flex;justify-content:space-between;margin:6px 0;color:green;">
  <span>Savings</span>
  <span>-₹${savings}</span>
</div>

<hr style="margin:10px 0; border:none; border-top:1px solid #eee;">

<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:18px;">
  <span>Grand Total</span>
  <span>₹${grandTotal}</span>
</div>

`;
  
// PLACE ORDER
async function placeOrder(){

  let name = document.getElementById("name").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let address = document.getElementById("address").value.trim();

  // ✅ VALIDATION
  if(!name || !phone || !address){
    alert("Please fill all details");
    return;
  }

  if(phone.length < 10){
    alert("Enter valid phone number");
    return;
  }

  // ✅ CART CHECK
  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  // ✅ GPS CHECK
  if(!navigator.geolocation){
    alert("Location not supported");
    return;
  }

  // ✅ BUTTON LOCK
  const btn = document.querySelector(".btn");
  btn.disabled = true;
  btn.innerText = "Placing Order...";

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      try {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const mapLink =
          `https://www.google.com/maps?q=${lat},${lng}`;

        const restaurantId = cart[0]?.resId || null;

        // ✅ INSERT ORDER
        const { data: orderData, error: orderError } =
          await supabase
          .from("orders")
          .insert([{
            restaurant_id: restaurantId,

            customer_name: name,
            customer_phone: phone,
            customer_address: address,

            lat: lat,
            lng: lng,
            map_link: mapLink,

item_total: total,
delivery_charge: deliveryCharge,
platform_fee: platformFee,
grand_total: grandTotal,
            
            payment_method: "COD",
            payment_status: "pending",
            order_status: "pending"
          }])
          .select();

        if(orderError){
          console.log(orderError);
          alert("Order failed ❌");
          btn.disabled = false;
          btn.innerText = "Place Order";
          return;
        }

        const orderId = orderData[0].id;

        // ✅ ORDER ITEMS
        const itemsToInsert = cart.map(c => ({
          order_id: orderId,
          item_name: c.name,

          variant_name:
            (c.variant
              ? `Variant ₹${c.variant}`
              : "") +

            (c.addons && c.addons.length > 0
              ? " | " +
                c.addons.map(a => a.name).join(", ")
              : ""),

          quantity: c.qty,
          price: c.total
        }));

        const { error: itemError } =
          await supabase
          .from("order_items")
          .insert(itemsToInsert);

        if(itemError){
          console.log(itemError);
          alert("Items save failed ❌");
          btn.disabled = false;
          btn.innerText = "Place Order";
          return;
        }

        // ✅ SUCCESS
        localStorage.removeItem("cart");

        alert("Order Placed Successfully ✅");

        window.location.href = "index.html";

      } catch(err){

        console.log(err);

        alert("Something went wrong ❌");

        btn.disabled = false;
        btn.innerText = "Place Order";
      }

    },

    (err) => {

      alert("Please allow location access");

      btn.disabled = false;
      btn.innerText = "Place Order";
    }

  );
}
  
</script>

</body>
</html>
