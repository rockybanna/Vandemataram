<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:12px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.code{
font-size:18px;
font-weight:bold;
color:#ff6600;
}

.status{
margin-top:8px;
font-weight:bold;
}

.issue{
color:#dc3545;
}

.good{
color:#28a745;
}

</style>
</head>

<body>

<h2>My Orders</h2>

<div id="orders">
Loading...
</div>

<script>

const SUPABASE_URL =
"https://zozzoqzryejpkbddzoyi.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadOrders();

async function loadOrders(){

const { data } =
await db
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}
);

document.getElementById(
"orders"
).innerHTML =
data.map(order=>`

<div class="card">

<div class="code">
${order.order_code}
</div>

<div>
Amount:
₹${order.grand_total}
</div>

<div>
Created:
${new Date(order.created_at)
.toLocaleString()}
</div>

<div class="status">

Status:

${order.payment_status}

</div>

${
order.payment_status ===
"payment_issue"

?

`
<div class="issue">

Reason:
${order.rejection_reason || "Contact Support"}

</div>

<button
onclick="
alert(
'Resubmit screenshot feature coming next'
)
">

Upload New Screenshot

</button>
`

:

""

}

</div>

`).join("");

}

</script>

</body>
</html>
