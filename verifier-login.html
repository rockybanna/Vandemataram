<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verifier Login</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

.card{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
  margin-top:0;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#28a745;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}
</style>
</head>

<body>

<div class="card">

<h2>FoodXpress Verifier</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
username==="verifier" &&
password==="verifier123"
){

localStorage.setItem(
"verifierUser",
username
);

window.location.href =
"verifier.html";

}else{

alert("Invalid Login");

}

}

</script>

</body>
</html>
