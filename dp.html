<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Delivery Partner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}

.header{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.tab{
flex:1;
padding:10px;
text-align:center;
background:white;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.active{
background:#2196f3;
color:white;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:8px;
cursor:pointer;
color:white;
}

.accept{
background:#28a745;
}

.pickup{
background:#ff9800;
}

.ontheway{
background:#2196f3;
}

.delivered{
background:#4caf50;
}

</style>

</head>

<body>

<div class="header">
Delivery Partner
</div>

<div class="tabs">

<div
id="tab_available"
class="tab active"
onclick="loadOrders('available')">
Available
</div>

<div
id="tab_assigned"
class="tab"
onclick="loadOrders('assigned')">
Assigned
</div>

<div
id="tab_completed"
class="tab"
onclick="loadOrders('completed')">
Completed
</div>

</div>

<div id="orders">
Loading...
</div>

<script>

const SUPABASE_URL =
"https://zozzoqzryejpkbddzoyi.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvenpvcXpyeWVqcGtiZGR6b3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDMwNzIsImV4cCI6MjA5MTUxOTA3Mn0.RYQqP5mVTtga4Y1XsBTRs_o58Bj2gSLZ5Se6YMak-UE";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

loadOrders("available");

async function loadOrders(type){

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document
.getElementById(
"tab_" + type
)
.classList.add("active");

let query =
db
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(type==="available"){
query =
query
.eq("restaurant_status","ready")
.eq("delivery_status","unassigned");
}

if(type==="assigned"){
query =
query.in(
"delivery_status",
["assigned","picked_up","out_for_delivery"]
);
}

if(type==="completed"){
query =
query.eq(
"delivery_status",
"delivered"
);
}

const { data,error } =
await query;

if(error){
console.log(error);
return;
}

if(!data.length){

document.getElementById(
"orders"
).innerHTML =
"No Orders";

return;

}

document.getElementById(
"orders"
).innerHTML =
data.map(order=>`

<div class="card">

<b>${order.order_code}</b>

<br><br>

Customer:
${order.customer_name}

<br>

Address:
${order.customer_address}

<br>

Amount:
₹${order.grand_total}

<br>

Delivery Status:
${order.delivery_status}

${renderButtons(order)}

</div>

`).join("");

}

function renderButtons(order){

if(order.delivery_status==="unassigned"){

return `
<button
class="btn accept"
onclick="acceptDelivery('${order.id}')">
Accept Delivery
</button>
`;

}

if(order.delivery_status==="assigned"){

return `
<button
class="btn pickup"
onclick="pickedUp('${order.id}')">
Picked Up
</button>
`;

}

if(order.delivery_status==="picked_up"){

return `
<button
class="btn ontheway"
onclick="outForDelivery('${order.id}')">
On The Way
</button>
`;

}

if(order.delivery_status==="out_for_delivery"){

return `
<button
class="btn delivered"
onclick="markDelivered('${order.id}')">
Delivered
</button>
`;

}

return "";

}

async function acceptDelivery(orderId){

await db
.from("orders")
.update({
delivery_status:"assigned",
assigned_at:new Date().toISOString()
})
.eq("id",orderId);

loadOrders("available");

}

async function pickedUp(orderId){

await db
.from("orders")
.update({
delivery_status:"picked_up",
picked_up_at:new Date().toISOString()
})
.eq("id",orderId);

loadOrders("assigned");

}

async function outForDelivery(orderId){

await db
.from("orders")
.update({
delivery_status:"out_for_delivery",
out_for_delivery_at:new Date().toISOString()
})
.eq("id",orderId);

loadOrders("assigned");

}

async function markDelivered(orderId){

await db
.from("orders")
.update({
delivery_status:"delivered",
delivered_at:new Date().toISOString(),
completed_at:new Date().toISOString()
})
.eq("id",orderId);

loadOrders("completed");

}

</script>

</body>
</html>
